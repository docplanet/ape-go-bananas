# Publishes the site to GitHub Pages: the download page at /, and the browser
# tool at /tool/.
#
# It is a build now, not a file copy. The tool imports the engine's compiled
# dist/ (checks, the .apkg writer) and bundles it with sql.js and fflate, so
# the engine has to be built first and the site's own npm project second.
# The download page still reads the latest release from the GitHub API at run
# time, so shipping a version needs no rebuild here.
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'app/src/**', 'app/package.json', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deploy at a time, and none cancelled halfway: the release's own
# dispatch must not be dropped for a push that happened to start first.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24: the engine's build imports node:sqlite, which does not exist
      # below it. The browser bundle does not use node:sqlite -- sql.js stands
      # in for it -- but tsc still has to compile the module that does.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: engine — build dist/
        run: |
          npm ci
          npm run build
      # The tool page's bridge tier is the desktop app's shell (app/src/agent)
      # over HTTP, and pdf.js comes from app/node_modules with it.
      - name: app — install (the shell the site imports)
        working-directory: app
        run: npm ci
      - name: site — build
        working-directory: site
        run: |
          npm ci
          npm run build
      # The updater feed lives on our own domain, so a rename or a move off
      # GitHub cannot strand installed copies: tauri.conf points the app at
      # ankiengine.com/latest.json and this puts the feed there.
      #
      # Only a verified feed is published: the newest release carrying the
      # verified-feed.json that release.yml's verify attaches once every
      # platform is in the feed and the Windows build has been seen to run.
      # "Latest" is not good enough -- this runs on any push to main, which
      # can land while a release is still uploading, or after one failed its
      # checks, and the site would then offer every install a broken update.
      # No placeholder, ever: a deploy that cannot find a verified feed fails
      # and leaves the previous site serving.
      - name: updater feed — the newest verified release's
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          newest=""
          for tag in $(gh release list --repo "$repo" --exclude-drafts --exclude-pre-releases --limit 10 --json tagName --jq '.[].tagName'); do
            newest="${newest:-$tag}"
            if gh release download "$tag" --repo "$repo" --pattern verified-feed.json --output feed.json --clobber 2>/dev/null; then
              for p in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
                jq -e --arg p "$p" '.platforms[$p] | (.url // "") != "" and (.signature // "") != ""' feed.json >/dev/null \
                  || { echo "::error::$tag's verified feed has no usable $p entry"; exit 1; }
              done
              cp feed.json site/dist/latest.json
              echo "feed: $(jq -r .version feed.json), from $tag"
              [ "$tag" = "$newest" ] || echo "::warning::$newest is not verified (yet, or it failed release.yml's checks); the feed stays on $tag"
              exit 0
            fi
          done
          echo "::error::none of the newest releases carries a verified feed; the site is left as it is"
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
