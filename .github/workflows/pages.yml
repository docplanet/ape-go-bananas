# Publishes the site to GitHub Pages: the download page at /, and the browser
# tool at /tool/.
#
# It is a build now, not a file copy. The tool imports the engine's compiled
# dist/ (checks, the .apkg writer) and bundles it with sql.js and fflate, so
# the engine has to be built first and the site's own npm project second.
# The download page still reads the latest release from the GitHub API at run
# time, so shipping a version needs no rebuild here.
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'app/src/**', 'app/package.json', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deploy at a time, and none cancelled halfway: the release's own
# dispatch must not be dropped for a push that happened to start first.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24: the engine's build imports node:sqlite, which does not exist
      # below it. The browser bundle does not use node:sqlite -- sql.js stands
      # in for it -- but tsc still has to compile the module that does.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: engine — build dist/
        run: |
          npm ci
          npm run build
      # The tool page's bridge tier is the desktop app's shell (app/src/agent)
      # over HTTP, and pdf.js comes from app/node_modules with it.
      - name: app — install (the shell the site imports)
        working-directory: app
        run: npm ci
      - name: site — build
        working-directory: site
        run: |
          npm ci
          npm run build
      # The updater feed lives on our own domain, so a rename or a move off
      # GitHub cannot strand installed copies: tauri.conf points the app at
      # ankiengine.com/latest.json and this copies the release's feed there.
      #
      # Only a complete feed is copied. The version bump that goes out with a
      # tag touches package.json, which runs this workflow while the release's
      # four builds are still uploading -- and "latest" is already the new,
      # half-filled release. A feed missing a platform is kept off the site and
      # the one being served now stays; release.yml's verify dispatches this
      # again once the release is whole. No placeholder, ever: a deploy that
      # cannot produce a good feed fails and leaves the previous site serving.
      - name: updater feed — copy the latest release's latest.json onto the site, if it is complete
        shell: bash
        run: |
          set -euo pipefail
          complete() {
            for p in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
              jq -e --arg p "$p" '.platforms[$p] | (.url // "") != "" and (.signature // "") != ""' "$1" >/dev/null || return 1
            done
          }
          curl -fsSL -o release.json "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          if complete release.json; then
            cp release.json site/dist/latest.json
            echo "feed: $(jq -r .version release.json) from the latest release"
          else
            echo "::warning::the latest release's feed ($(jq -r .version release.json)) is not complete yet; keeping the one on the site"
            curl -fsSL -o site/dist/latest.json https://ankiengine.com/latest.json
            complete site/dist/latest.json
            echo "feed: $(jq -r .version site/dist/latest.json), unchanged"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
